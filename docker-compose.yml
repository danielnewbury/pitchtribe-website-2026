   #   - ./traefik/tra.yaml:/etc/traefik/tra.yaml:ro
    #networks:
    ##  - pitch_net

  # PitchTribe Web Frontend / Landing Node
  web:
    image: nginx:alpine
    container_name: pitch_web_dev
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pitch-web.rule=Host(`pitchtribe.local`, `localhost`)"
      - "traefik.http.routers.pitch-web.entrypoints=web"
      - "traefik.http.services.pitch-web.loadbalancer.server.port=80"
    networks:
      - pitch_net
